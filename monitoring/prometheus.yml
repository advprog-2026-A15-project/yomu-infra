# ─── Monitoring ───────────────────────────────────────────────────
global:
  scrape_interval: 15s # Prometheus akan menarik data setiap 15 detik

scrape_configs:
  - job_name: "yomu-services"
    metrics_path: "/actuator/prometheus"
    static_configs:
      # Karena berjalan di jaringan Docker yang sama, kita bisa memanggil nama servicenya langsung beserta portnya
      - targets:
          - "service-auth:8081"
          - "service-learning:8082"
          - "service-achievements:8083"
          - "service-forum:8084"
          - "service-clan:8085"
          - "api-gateway:8090"
          - "rabbitmq:15672"
