services:
  # ─── RabbitMQ ──────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.0-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  auth-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=yomu_auth
      - POSTGRES_USER=yomu
      - POSTGRES_PASSWORD=yomu
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yomu -d yomu_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  learning-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=yomu_learning
      - POSTGRES_USER=yomu
      - POSTGRES_PASSWORD=yomu
    ports:
      - "5434:5432"
    volumes:
      - learning-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yomu -d yomu_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  achievements-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=yomu_achievements
      - POSTGRES_USER=yomu
      - POSTGRES_PASSWORD=yomu
    ports:
      - "5435:5432"
    volumes:
      - achievements-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yomu -d yomu_achievements"]
      interval: 5s
      timeout: 5s
      retries: 10

  forum-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=yomu_forum
      - POSTGRES_USER=yomu
      - POSTGRES_PASSWORD=yomu
    ports:
      - "5436:5432"
    volumes:
      - forum-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yomu -d yomu_forum"]
      interval: 5s
      timeout: 5s
      retries: 10

  clan-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=yomu_clan
      - POSTGRES_USER=yomu
      - POSTGRES_PASSWORD=yomu
    ports:
      - "5437:5432"
    volumes:
      - clan-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yomu -d yomu_clan"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── API Gateway ──────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8090:8090"
    depends_on:
      rabbitmq:
        condition: service_healthy
      service-auth:
        condition: service_started
      service-learning:
        condition: service_started
      service-achievements:
        condition: service_started
      service-forum:
        condition: service_started
      service-clan:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq

  # ─── Auth Service ─────────────────────────────────────────────────
  service-auth:
    build:
      context: .
      dockerfile: ./service-auth/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/yomu_auth
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=yomu
      - SPRING_DATASOURCE_PASSWORD=yomu
      - SPRING_RABBITMQ_HOST=rabbitmq

  # ─── Learning Service ────────────────────────────────────────────
  service-learning:
    build:
      context: .
      dockerfile: ./service-learning/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8082:8082"
    depends_on:
      learning-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://learning-db:5432/yomu_learning
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=yomu
      - SPRING_DATASOURCE_PASSWORD=yomu
      - SPRING_RABBITMQ_HOST=rabbitmq

  # ─── Achievements Service ────────────────────────────────────────
  service-achievements:
    build:
      context: .
      dockerfile: ./service-achievements/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8083:8083"
    depends_on:
      achievements-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://achievements-db:5432/yomu_achievements
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=yomu
      - SPRING_DATASOURCE_PASSWORD=yomu
      - SPRING_RABBITMQ_HOST=rabbitmq

  # ─── Forum Service ───────────────────────────────────────────────
  service-forum:
    build:
      context: .
      dockerfile: ./service-forum/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8084:8084"
    depends_on:
      forum-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://forum-db:5432/yomu_forum
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=yomu
      - SPRING_DATASOURCE_PASSWORD=yomu
      - SPRING_RABBITMQ_HOST=rabbitmq

  # ─── Clan Service ────────────────────────────────────────────────
  service-clan:
    build:
      context: .
      dockerfile: ./service-clan/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8085:8085"
    depends_on:
      clan-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://clan-db:5432/yomu_clan
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=yomu
      - SPRING_DATASOURCE_PASSWORD=yomu
      - SPRING_RABBITMQ_HOST=rabbitmq

volumes:
  auth-db-data:
  learning-db-data:
  achievements-db-data:
  forum-db-data:
  clan-db-data:
