services:
  # ─── RabbitMQ ──────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.0-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  # ─── API Gateway ──────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8080:8080"
    depends_on:
      - rabbitmq
      - service-auth
      - service-learning
      - service-achievements
      - service-forum
      - service-clan
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - YOMU_SECURITY_BYPASS=true
      - SPRING_MAIN_WEB_APPLICATION_TYPE=reactive

  # ─── Auth Service ─────────────────────────────────────────────────
  service-auth:
    build:
      context: .
      dockerfile: ./service-auth/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/yomu_auth;MODE=PostgreSQL;AUTO_SERVER=TRUE
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - YOMU_SECURITY_BYPASS=true
    volumes:
      - auth-data:/data

  # ─── Learning Service ────────────────────────────────────────────
  service-learning:
    build:
      context: .
      dockerfile: ./service-learning/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/yomu_learning;MODE=PostgreSQL;AUTO_SERVER=TRUE
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - YOMU_SECURITY_BYPASS=true
    volumes:
      - learning-data:/data

  # ─── Achievements Service ────────────────────────────────────────
  service-achievements:
    build:
      context: .
      dockerfile: ./service-achievements/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/yomu_achievements;MODE=PostgreSQL;AUTO_SERVER=TRUE
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - YOMU_SECURITY_BYPASS=true
    volumes:
      - achievements-data:/data

  # ─── Forum Service ───────────────────────────────────────────────
  service-forum:
    build:
      context: .
      dockerfile: ./service-forum/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/yomu_forum;MODE=PostgreSQL;AUTO_SERVER=TRUE
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - YOMU_SECURITY_BYPASS=true
    volumes:
      - forum-data:/data

  # ─── Clan Service ────────────────────────────────────────────────
  service-clan:
    build:
      context: .
      dockerfile: ./service-clan/Dockerfile
      args:
        CLEAN_GRADLE_CACHE: ${CLEAN_GRADLE_CACHE:-0}
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/yomu_clan;MODE=PostgreSQL;AUTO_SERVER=TRUE
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - YOMU_SECURITY_BYPASS=true
    volumes:
      - clan-data:/data

volumes:
  auth-data:
  learning-data:
  achievements-data:
  forum-data:
  clan-data:
