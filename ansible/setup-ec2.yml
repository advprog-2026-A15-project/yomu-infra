---
- name: Setup EC2 Environment for Yomu App
  hosts: all
  become: yes
  vars:
    swap_file_path: /swapfile
    swap_file_size_mb: 4096

  tasks:
    - name: Check if swap file exists
      stat:
        path: "{{ swap_file_path }}"
      register: swap_file_stat

    - name: Create swap file
      command: fallocate -l {{ swap_file_size_mb }}M {{ swap_file_path }}
      when: not swap_file_stat.stat.exists
      ignore_errors: yes

    - name: Create swap file via dd if fallocate fails
      command: dd if=/dev/zero of={{ swap_file_path }} bs=1M count={{ swap_file_size_mb }}
      when: not swap_file_stat.stat.exists and (ansible_failed_result is defined or ansible_failed_task is defined)
      
    - name: Set swap file permissions
      file:
        path: "{{ swap_file_path }}"
        mode: '0600'
      when: not swap_file_stat.stat.exists

    - name: Make swap file
      command: mkswap {{ swap_file_path }}
      when: not swap_file_stat.stat.exists

    - name: Enable swap
      command: swapon {{ swap_file_path }}
      when: not swap_file_stat.stat.exists

    - name: Add swap to fstab
      mount:
        name: none
        src: "{{ swap_file_path }}"
        fstype: swap
        opts: sw
        passno: 0
        dump: 0
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages for Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker and Docker Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user | default('ubuntu') }}"
        groups: docker
        append: yes
