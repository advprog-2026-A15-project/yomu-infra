[ec2]
# Ganti <EC2_PUBLIC_IP> dengan IP Public dari instance EC2 Anda
# Ganti <PATH_TO_PEM_KEY> dengan lokasi file .pem Anda (misalnya: ~/.ssh/my-key.pem)
34.200.246.236 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/yomu-app-key.pem

[all:vars]
# Anda bisa menambahkan variabel global di sini jika diperlukan
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
