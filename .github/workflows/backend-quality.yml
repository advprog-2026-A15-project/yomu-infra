name: Backend Quality

on:
  pull_request:
    paths:
      - "api-gateway/**"
      - "service-*/**"
      - "shared-lib/**"
      - "docker-compose.yml"
      - "clone-repositories.sh"
      - ".github/workflows/backend-quality.yml"
  push:
    branches:
      - main
      - staging
    paths:
      - "api-gateway/**"
      - "service-*/**"
      - "shared-lib/**"
      - "docker-compose.yml"
      - "clone-repositories.sh"
      - ".github/workflows/backend-quality.yml"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Clone service repositories when running from infra repo
        run: |
          chmod +x ./clone-repositories.sh
          ./clone-repositories.sh

      - name: Publish shared library locally
        working-directory: shared-lib
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Build backend services
        run: |
          for service in api-gateway service-auth service-learning service-achievements service-forum service-clan; do
            echo "Building ${service}"
            (cd "${service}" && ./gradlew build --no-daemon)
          done
