name: Backend Quality

on:
  pull_request:
    paths:
      - "api-gateway"
      - "api-gateway/**"
      - "service-*"
      - "service-*/**"
      - "shared-lib"
      - "shared-lib/**"
      - "docker-compose.yml"
      - "docker-compose.deploy.yml"
      - "docker-compose.prod.yml"
      - ".gitmodules"
      - ".github/workflows/backend-quality.yml"
  push:
    branches:
      - main
      - staging
    paths:
      - "api-gateway"
      - "api-gateway/**"
      - "service-*"
      - "service-*/**"
      - "shared-lib"
      - "shared-lib/**"
      - "docker-compose.yml"
      - "docker-compose.deploy.yml"
      - "docker-compose.prod.yml"
      - ".gitmodules"
      - ".github/workflows/backend-quality.yml"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.deploy.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Publish shared library locally
        working-directory: shared-lib
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Build backend services
        run: |
          services=(
            api-gateway
            service-auth
            service-learning
            service-achievements
            service-forum
            service-clan
            service-notification
          )

          for service in "${services[@]}"; do
            echo "Building ${service}"
            (cd "${service}" && sed -i 's/\r$//' ./gradlew && chmod +x ./gradlew && ./gradlew build jacocoTestReport jacocoTestCoverageVerification --no-daemon)
            
            echo "Coverage for ${service}:"
            awk -F"," '{ instructions += $4 + $5; covered += $5 } END { print int(100*covered/instructions) "%" }' "${service}/build/reports/jacoco/test/jacocoTestReport.csv" || echo "Coverage report not found"
          done
