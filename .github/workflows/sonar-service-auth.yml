name: SonarQube Service Auth

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "service-auth/**"
      - "shared-lib/**"
      - ".github/workflows/sonar-service-auth.yml"
  pull_request:
    paths:
      - "service-auth/**"
      - "shared-lib/**"
      - ".github/workflows/sonar-service-auth.yml"
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Clone service repositories when running from infra repo
        run: |
          if [ -f "./clone-repositories.sh" ]; then
            chmod +x ./clone-repositories.sh
            ./clone-repositories.sh
          fi

      - name: Publish shared library locally
        working-directory: shared-lib
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Build, Test and Analyze Service Auth
        working-directory: service-auth
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew build jacocoTestReport sonar --no-daemon
