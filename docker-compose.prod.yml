services:
  # ─── DuckDNS ───────────────────────────────────────────────────────
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
      - UPDATE_IP=both
    restart: unless-stopped

  # ─── RabbitMQ ──────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.0-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  # ─── Reverse Proxy (Nginx) ──────────────────────────────────────────
  nginx-proxy:
    image: ghcr.io/advprog-2026-a15-project/yomu-nginx:main
    ports:
      - "80:80"
    depends_on:
      - frontend
      - api-gateway

  # ─── Frontend ──────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/advprog-2026-a15-project/yomu-frontend:main
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
    depends_on:
      - api-gateway

  # ─── API Gateway ──────────────────────────────────────────────────
  api-gateway:
    image: ghcr.io/advprog-2026-a15-project/api-gateway:main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
    depends_on:
      - rabbitmq
      - service-auth
      - service-learning
      - service-achievements
      - service-forum
      - service-clan
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_WEB_APPLICATION_TYPE=reactive

  # ─── Auth Service ─────────────────────────────────────────────────
  service-auth:
    image: ghcr.io/advprog-2026-a15-project/service-auth:main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/yomu_auth;MODE=PostgreSQL;AUTO_SERVER=TRUE
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - YOMU_SECURITY_BYPASS=true
      - YOMU_ADMIN_EMAILS=${YOMU_ADMIN_EMAILS:-christna.yosua@ui.ac.id,christian.yosua@ui.ac.id,tirta.rendy@ui.ac.id,nathanael.leander@ui.ac.id}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - auth-data:/data

  # ─── Learning Service ────────────────────────────────────────────
  service-learning:
    image: ghcr.io/advprog-2026-a15-project/service-learning:main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/yomu_learning;MODE=PostgreSQL;AUTO_SERVER=TRUE
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_RABBITMQ_HOST=rabbitmq
      - YOMU_SECURITY_BYPASS=true
    volumes:
      - learning-data:/data

  # ─── Achievements Service ────────────────────────────────────────
  service-achievements:
    image: ghcr.io/advprog-2026-a15-project/service-achievements:main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/yomu_achievements;MODE=PostgreSQL;AUTO_SERVER=TRUE
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP=true
      - SPRING_RABBITMQ_LISTENER_DIRECT_AUTO_STARTUP=true
    volumes:
      - achievements-data:/data

  # ─── Forum Service ───────────────────────────────────────────────
  service-forum:
    image: ghcr.io/advprog-2026-a15-project/service-forum:main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/yomu_forum;MODE=PostgreSQL;AUTO_SERVER=TRUE
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_RABBITMQ_HOST=rabbitmq
      - AUTH_GRPC_ADDRESS=static://service-auth:9091
    volumes:
      - forum-data:/data

  # ─── Clan Service ────────────────────────────────────────────────
  service-clan:
    image: ghcr.io/advprog-2026-a15-project/service-clan:main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/yomu_clan;MODE=PostgreSQL;AUTO_SERVER=TRUE
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_RABBITMQ_HOST=rabbitmq
      - YOMU_SECURITY_BYPASS=true
    volumes:
      - clan-data:/data



  # ─── Monitoring ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway
      - service-auth
      - service-learning
      - service-achievements
      - service-clan
      - service-forum
      - rabbitmq

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards

volumes:
  auth-data:
  learning-data:
  achievements-data:
  forum-data:
  clan-data:
